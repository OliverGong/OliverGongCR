services:
  postgres:
    image: postgres:16-alpine
    environment:
      {
        POSTGRES_DB: '${POSTGRES_DB:-resume_studio}',
        POSTGRES_USER: '${POSTGRES_USER:-resume}',
        POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-local-dev-only}',
      }
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}'],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s, timeout: 5s, retries: 5 }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      {
        RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-resume}',
        RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-local-dev-only}',
      }
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      {
        test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping'],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ':9001'
    environment:
      {
        MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minio-local}',
        MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-local-dev-only}',
      }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
volumes:
  postgres-data:
  minio-data:
