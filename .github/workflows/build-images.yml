name: Build Images
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, file: apps/web/Dockerfile }
          - { name: server, file: apps/server/Dockerfile }
          - { name: ai-worker, file: apps/ai-worker/Dockerfile }
          - { name: export-worker, file: apps/export-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: docker/metadata-action@v5
        id: meta
        with:
          {
            images: 'ghcr.io/${{ github.repository_owner }}/resume-studio-${{ matrix.name }}',
            tags: 'type=ref,event=branch\ntype=ref,event=tag\ntype=sha',
          }
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: '${{ matrix.file }}',
            push: true,
            tags: '${{ steps.meta.outputs.tags }}',
            labels: '${{ steps.meta.outputs.labels }}',
          }
