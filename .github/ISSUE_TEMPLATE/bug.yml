name: Bug 报告
description: 报告可复现缺陷
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: 问题描述 }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: 复现步骤 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 期望行为 }
    validations: { required: true }
