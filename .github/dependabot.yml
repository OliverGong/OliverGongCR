version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { javascript: { patterns: ['*'] } }
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups: { java: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
